<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UnPaws</title>
<style>
:root{--bg:#0e0e0f;--fg:#f1f1f1;--mute:#9a9a9f;--line:#2a2a2e;--accent:#ff4d4d;--ok:#3ddc84}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;justify-content:center}
.wrap{width:min(960px,100%);padding:18px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.brand{font-weight:800;letter-spacing:-.02em;font-size:20px;cursor:pointer}
.brand span{color:var(--accent)}
.hud{display:flex;gap:18px;align-items:center;color:var(--mute);font-size:13px;font-variant-numeric:tabular-nums}
.hearts{letter-spacing:3px;color:var(--accent);font-size:15px}
.cue{height:96px;display:flex;align-items:center;justify-content:center;position:relative}
.cue-word{font-size:clamp(32px,7vw,58px);font-weight:900;letter-spacing:.04em;white-space:nowrap}
.cue-word.dim{color:#55555b;font-weight:700;font-size:clamp(22px,4vw,30px);letter-spacing:.02em}
.cue-bar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:220px;height:3px;background:var(--line);border-radius:2px;overflow:hidden;opacity:0}
.cue-bar.on{opacity:1}
.cue-bar i{display:block;height:100%;background:var(--fg);width:100%}
.player{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
canvas{width:100%;height:100%;display:block}
.controls{position:absolute;left:0;right:0;bottom:0;padding:24px 14px 10px;background:linear-gradient(transparent,rgba(0,0,0,.65));transition:opacity .25s;pointer-events:none}
.controls.hidden{opacity:0}
.prog{height:4px;background:rgba(255,255,255,.25);border-radius:2px;margin-bottom:10px;position:relative}
.prog i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:2px}
.row{display:flex;align-items:center;gap:14px;font-size:13px;color:#eee;font-variant-numeric:tabular-nums}
.row svg{width:24px;height:24px;fill:#fff;display:block}
.spacer{flex:1}
.flash{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px 0 0 -39px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none}
.flash svg{width:36px;height:36px;fill:#fff}
.flash.go{animation:fl .6s ease-out}
@keyframes fl{0%{opacity:1;transform:scale(.9)}100%{opacity:0;transform:scale(1.5)}}
.spinner{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border:4px solid rgba(255,255,255,.22);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;display:none;pointer-events:none}
@keyframes sp{to{transform:rotate(360deg)}}
.player.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.edge{position:absolute;inset:0;pointer-events:none;border-radius:12px;transition:box-shadow .35s}
.edge.bad{box-shadow:inset 0 0 0 4px var(--accent);transition:none}
.edge.good{box-shadow:inset 0 0 0 3px var(--ok);transition:none}
.meta{margin-top:12px;display:flex;gap:12px;align-items:flex-start}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f6a85c,#6b3a6e);flex:none}
.title{font-size:16px;font-weight:650}
.sub{color:var(--mute);font-size:13px;margin-top:3px}
.toast{min-height:22px;margin-top:14px;font-size:14px;color:var(--mute);text-align:center}
.toast.bad{color:var(--accent)}
.toast.good{color:var(--ok)}
.help{margin-top:10px;text-align:center;color:#5d5d63;font-size:12px}
.overlay{position:fixed;inset:0;background:rgba(8,8,9,.9);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px;overflow:auto}
.card{max-width:540px;width:100%;text-align:center}
.card h1{font-size:52px;margin:0 0 4px;font-weight:900;letter-spacing:-.03em}
.card h1 span{color:var(--accent)}
.card h2{font-size:30px;margin:0 0 6px;font-weight:850;letter-spacing:-.01em}
.card .eyebrow{color:var(--mute);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.card p{color:#c9c9ce;line-height:1.55;margin:8px 0}
.kbd{display:inline-block;border:1px solid #444;border-bottom-width:2px;border-radius:5px;padding:0 6px;font-size:12px;color:#ddd;font-family:ui-monospace,Menlo,monospace}
.btn{appearance:none;border:0;background:var(--fg);color:#111;font-weight:700;font-size:15px;padding:12px 24px;border-radius:999px;cursor:pointer;margin:16px 5px 0;font-family:inherit}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid #444}
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}
@media(max-width:520px){.levels{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)!important}}
.lv{background:#18181b;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--fg);text-align:left;font:inherit}
.lv:hover:not([disabled]){border-color:#555}
.lv b{display:block;font-size:14px}
.lv small{color:var(--mute);font-size:12px}
.lv[disabled]{opacity:.32;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 8px}
.stat{background:#18181b;border-radius:10px;padding:10px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat small{color:var(--mute);font-size:12px}
.insight{font-style:italic;color:#ececef!important}
.hide{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand" id="home">Un<span>Paws</span></div>
    <div class="hud">
      <span id="hudLevel">—</span>
      <span id="hudProg"></span>
      <span class="hearts" id="hudHearts"></span>
    </div>
  </header>

  <div class="cue">
    <div class="cue-word dim" id="cueWord">waiting</div>
    <div class="cue-bar" id="cueBar"><i id="cueFill"></i></div>
  </div>

  <div class="player" id="player">
    <canvas id="cv"></canvas>
    <div class="spinner" id="spinner"></div>
    <div class="flash" id="flash"><svg viewBox="0 0 24 24"><path id="flashPath" d=""/></svg></div>
    <div class="controls" id="controls">
      <div class="prog"><i id="progFill"></i></div>
      <div class="row">
        <svg viewBox="0 0 24 24"><path id="ctlIcon" d=""/></svg>
        <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z" transform="scale(-1,1) translate(-24,0)"/></svg>
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
        <span id="timeLabel">0:00 / 12:47</span>
        <span class="spacer"></span>
        <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
      </div>
    </div>
    <div class="edge" id="edge"></div>
  </div>

  <div class="meta">
    <div class="avatar"></div>
    <div>
      <div class="title">Coastal drive at golden hour (no talking, 4K)</div>
      <div class="sub">slowroads · 2.1M views · 3 years ago</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="help">One button: <span class="kbd">Space</span> <span class="kbd">K</span> or tap the video</div>
</div>

<div class="overlay" id="overlay"><div class="card" id="card"></div></div>

<script>
(()=>{
const PLAY="M8 5v14l11-7z", PAUSE="M6 5h4v14H6zM14 5h4v14h-4z";
const DURATION=767;

const LEVELS=[
 {name:"Obey",rule:"A cue appears above the video. <b>PAUSE</b> means pause it. <b>UNPAUSE</b> means unpause it. That's it.",window:2.2,n:8,mode:"align"},
 {name:"Dodge",rule:"Now some cues ask for what's already true. If the video is already paused and the cue says <b>PAUSE</b>, the right move is no move.",window:2.0,n:10,mode:"dodge"},
 {name:"Stutter",rule:"The controls are gone. And sometimes the video freezes on its own, usually right when you look. Did <i>you</i> pause it?",window:1.9,n:10,mode:"dodge",stutter:true,hideControls:true},
 {name:"Ghost",rule:"Paused frames drift. Icons flash by themselves. Trust your hands, not your eyes.",window:1.9,n:10,mode:"dodge",stutter:true,hideControls:true,ghost:true},
 {name:"Words",rule:"Cues get wordier. Every cue describes how the video should <i>end up</i>. Work out the state, then decide whether anything needs doing.",window:2.5,n:12,mode:"dodge",words:true,stutter:true,hideControls:true},
 {name:"Endless",rule:"Everything at once, faster and faster. Three hearts. How far can you get?",window:1.9,n:Infinity,mode:"dodge",stutter:true,hideControls:true,ghost:true,words:true,endless:true}
];
const WORDS=[
 {t:"PAUSE",p:false},{t:"UNPAUSE",p:true},{t:"PLAY",p:true},{t:"STOP",p:false},
 {t:"RESUME",p:true},{t:"FREEZE",p:false},{t:"DON'T PAUSE",p:true},{t:"DON'T PLAY",p:false},
 {t:"UN-UNPAUSE",p:false},{t:"NOT PAUSED",p:true},{t:"NOT PLAYING",p:false},{t:"DON'T STOP",p:true}
];

const $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d");
const player=$("player"), overlay=$("overlay"), card=$("card");

// ---------- persistence ----------
function load(k,d){try{const v=localStorage.getItem("unpaws."+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem("unpaws."+k,JSON.stringify(v))}catch(e){}}
let unlocked=load("unlocked",0), best=load("best",0);

// ---------- state ----------
let vt=60+Math.random()*180;   // content time of the "video"
let playing=true;
const fx={frozen:0,spin:false,drift:0,grainLive:false};
let G={phase:"idle",lvIdx:0,lv:LEVELS[0],hearts:3,progress:0,score:0,cue:null,nextAt:0,graceUntil:0,lastCueEnd:0,stats:null,matchStreak:0};

function newStats(){return{actionCues:0,actionHit:0,rts:[],dodgeCues:0,dodgeHeld:0,flinch:0,slow:0,unprompted:0,freezeErr:0,freezeCues:0,freezeOk:0}}

// ---------- canvas ----------
function resize(){const r=player.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.round(r.width*d);cv.height=Math.round(r.height*d)}
window.addEventListener("resize",resize);resize();
const W=960,H=540;
const mod=(a,b)=>((a%b)+b)%b;
function ridge(base,amp,off,color,f1,f2){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=8){const u=x+off;ctx.lineTo(x,base-amp*(.6*Math.sin(u*f1)+.4*Math.sin(u*f2+1.7)))}ctx.lineTo(W,H);ctx.closePath();ctx.fill()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();ctx.fill()}
function cloud(x,y,s){ctx.beginPath();ctx.ellipse(x,y,60*s,16*s,0,0,7);ctx.ellipse(x+30*s,y-10*s,36*s,14*s,0,0,7);ctx.ellipse(x-34*s,y-4*s,30*s,11*s,0,0,7);ctx.fill()}
function wheel(x,y,a){ctx.fillStyle="#08060a";ctx.beginPath();ctx.arc(x,y,18,0,7);ctx.fill();ctx.strokeStyle="#7a6680";ctx.lineWidth=2;for(let i=0;i<4;i++){const b=a+i*Math.PI/4;ctx.beginPath();ctx.moveTo(x-Math.cos(b)*11,y-Math.sin(b)*11);ctx.lineTo(x+Math.cos(b)*11,y+Math.sin(b)*11);ctx.stroke()}ctx.fillStyle="#9a8aa0";ctx.beginPath();ctx.arc(x,y,3,0,7);ctx.fill()}
function draw(now){
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  const t=vt;
  const g=ctx.createLinearGradient(0,0,0,H*.72);g.addColorStop(0,"#2b1d4a");g.addColorStop(.55,"#c8566a");g.addColorStop(1,"#f6a85c");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const sx=W*.7,sy=H*.52;
  const sg=ctx.createRadialGradient(sx,sy,10,sx,sy,170);sg.addColorStop(0,"rgba(255,230,170,.9)");sg.addColorStop(1,"rgba(255,200,120,0)");
  ctx.fillStyle=sg;ctx.fillRect(sx-170,sy-170,340,340);
  ctx.fillStyle="#ffe2a8";ctx.beginPath();ctx.arc(sx,sy,46,0,7);ctx.fill();
  ctx.fillStyle="rgba(255,215,215,.33)";
  for(let i=0;i<6;i++){cloud(mod(i*230-t*14,W+320)-160,55+(i*57)%150,.8+(i%3)*.3)}
  ctx.strokeStyle="rgba(40,18,40,.75)";ctx.lineWidth=2;
  for(let i=0;i<5;i++){const x=mod(i*190+t*42,W+200)-100,y=140+i*16+Math.sin(t*1.3+i)*8,f=Math.sin(t*9+i*2)*6;ctx.beginPath();ctx.moveTo(x-10,y-f);ctx.quadraticCurveTo(x-5,y-2,x,y);ctx.quadraticCurveTo(x+5,y-2,x+10,y-f);ctx.stroke()}
  ridge(H*.63,70,t*10,"#7a3f72",.006,.013);
  ridge(H*.71,46,t*36,"#432549",.011,.023);
  ctx.fillStyle="#2a1e2e";ctx.fillRect(0,H*.755,W,H*.03);
  ctx.fillStyle="#1d1420";ctx.fillRect(0,H*.785,W,H*.215);
  for(let x=-mod(t*240,210);x<W+40;x+=210){ctx.fillStyle="#140d16";ctx.fillRect(x,H*.58,6,H*.2);ctx.fillRect(x-16,H*.58,38,4)}
  ctx.fillStyle="#f3d38a";for(let x=-mod(t*330,120);x<W;x+=120)ctx.fillRect(x,H*.9,62,6);
  // van
  const cx=W*.36,cy=H*.80+Math.sin(t*11)*1.5;
  ctx.fillStyle="#120c15";rr(cx-95,cy-62,190,48,12);rr(cx-62,cy-96,118,40,12);
  ctx.fillStyle="rgba(246,168,92,.55)";rr(cx-52,cy-88,44,26,5);rr(cx+2,cy-88,44,26,5);
  ctx.fillStyle="#ffd9a0";ctx.fillRect(cx+88,cy-46,7,8);
  wheel(cx-56,cy-12,t*14);wheel(cx+58,cy-12,t*14);
  // grain + vignette
  let s=fx.grainLive?Math.floor(now/42):Math.floor(t*24);
  ctx.fillStyle="rgba(255,255,255,.06)";
  for(let i=0;i<260;i++){s=(s*1103515245+12345)&0x7fffffff;const x=s%W;s=(s*1103515245+12345)&0x7fffffff;ctx.fillRect(x,s%H,2,2)}
  const vg=ctx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.95);vg.addColorStop(0,"rgba(0,0,0,0)");vg.addColorStop(1,"rgba(0,0,0,.45)");
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
}

// ---------- ui helpers ----------
const fmt=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
function flash(isPlaying){$("flashPath").setAttribute("d",isPlaying?PLAY:PAUSE);const f=$("flash");f.classList.remove("go");void f.offsetWidth;f.classList.add("go")}
let toastT;
function toast(msg,cls){const t=$("toast");t.textContent=msg;t.className="toast "+(cls||"");clearTimeout(toastT);toastT=setTimeout(()=>{t.textContent=""},2200)}
function edge(cls){const e=$("edge");e.className="edge "+cls;setTimeout(()=>{e.className="edge"},cls==="bad"?260:160)}
function shake(){player.classList.remove("shake");void player.offsetWidth;player.classList.add("shake")}
function setCue(text,dim){const c=$("cueWord");c.textContent=text;c.className="cue-word"+(dim?" dim":"")}
const stateWord=p=>p?"playing":"paused";
function hud(){
  $("hudLevel").textContent=G.phase==="idle"?"":(G.lvIdx+1)+" · "+G.lv.name;
  $("hudProg").textContent=G.phase==="idle"?"":(G.lv.endless?"score "+G.score:G.progress+"/"+G.lv.n);
  $("hudHearts").textContent=G.phase==="idle"?"":"♥".repeat(Math.max(0,G.hearts))+"♡".repeat(Math.max(0,3-G.hearts));
}

// ---------- effects ----------
function freeze(sec){fx.frozen=Math.max(fx.frozen,sec);fx.spin=G.lv.ghost&&Math.random()<.5}
function updateFx(dt,now){
  const L=G.lv,active=G.phase==="gap"||G.phase==="cue";
  if(fx.frozen>0){fx.frozen-=dt;if(fx.frozen<=0){fx.frozen=0;fx.spin=false}}
  if(fx.drift>0)fx.drift-=dt;
  if(active&&L.stutter&&playing&&fx.frozen<=0&&Math.random()<dt*.28)freeze(.4+Math.random()*1.3);
  if(active&&L.ghost&&!playing&&fx.drift<=0&&Math.random()<dt*.3)fx.drift=.5+Math.random()*1.2;
  if(active&&L.ghost&&Math.random()<dt*.16)flash(Math.random()<.5);
  fx.grainLive=active&&L.ghost&&!playing;
  if(!playing){fx.frozen=0;fx.spin=false}
  $("spinner").style.display=(playing&&fx.frozen>0&&fx.spin)?"block":"none";
}

// ---------- game ----------
function press(){
  if(G.phase!=="gap"&&G.phase!=="cue")return;
  const now=performance.now();
  const was=playing;playing=!playing;flash(playing);
  if(!playing)fx.frozen=0;
  if(G.phase==="cue"){
    const c=G.cue;c.presses++;
    if(c.required){success(now,(now-c.start));}
    else{G.stats.flinch++;fail(now,"Flinched. It was already "+stateWord(was)+", so the cue asked for nothing. Now it's "+stateWord(playing)+".",c.duringFreeze)}
  }else{
    if(now<G.graceUntil){toast("Late. Now it's "+stateWord(playing)+".","bad");return}
    G.stats.unprompted++;
    fail(now,"Nobody asked. Now it's "+stateWord(playing)+".",fx.frozen>0)
  }
}
function pickCue(){
  const L=G.lv;let target;
  if(L.mode==="align")target=!playing;
  else{
    let match=Math.random()<.45;
    if(G.matchStreak>=2)match=false;
    if(G.matchStreak<=-3)match=true;
    target=match?playing:!playing;
    G.matchStreak=match?Math.max(1,G.matchStreak+1):Math.min(-1,G.matchStreak-1);
  }
  let text=target?"UNPAUSE":"PAUSE";
  const useWords=L.words&&(!L.endless||G.score>=8);
  if(useWords&&Math.random()<.8){const opts=WORDS.filter(w=>w.p===target);text=opts[Math.floor(Math.random()*opts.length)].t}
  return{text,target};
}
function windowLen(){const L=G.lv;return L.endless?Math.max(.85,L.window-G.score*.035):L.window}
function newCue(now){
  const {text,target}=pickCue();
  G.cue={text,target,required:target!==playing,start:now,presses:0,win:windowLen(),duringFreeze:false};
  if(G.lv.stutter&&playing&&Math.random()<.45)freeze(.5+Math.random()*1.2);
  if(G.lv.ghost&&!playing&&Math.random()<.4)fx.drift=.6+Math.random()*1.0;
  G.cue.duringFreeze=fx.frozen>0||fx.drift>0;
  if(G.cue.duringFreeze)G.stats.freezeCues++;
  if(G.cue.required)G.stats.actionCues++;else G.stats.dodgeCues++;
  setCue(text,false);$("cueBar").classList.add("on");
  G.phase="cue";
}
function clearCue(now){G.cue=null;G.lastCueEnd=now;setCue("",true);$("cueBar").classList.remove("on")}
function gapLen(){const base=G.lv.endless?Math.max(.35,1-G.score*.015):.7;return(base+Math.random()*base*1.2)*1000}
function success(now,rt){
  const c=G.cue;
  if(c.required){G.stats.actionHit++;G.stats.rts.push(rt);toast(Math.round(rt)+" ms","good")}
  else{G.stats.dodgeHeld++;toast("Held.","good")}
  if(c.duringFreeze)G.stats.freezeOk++;
  edge("good");clearCue(now);
  G.progress++;G.score++;hud();
  if(!G.lv.endless&&G.progress>=G.lv.n){G.phase="over";setTimeout(()=>finish(true),550);return}
  G.phase="gap";G.nextAt=now+gapLen();
}
function fail(now,msg,freezeRelated){
  if(freezeRelated)G.stats.freezeErr++;
  G.hearts--;hud();toast(msg,"bad");edge("bad");shake();
  if(G.cue)clearCue(now);
  if(G.hearts<=0){G.phase="over";setTimeout(()=>finish(false),700);return}
  G.phase="gap";G.nextAt=now+1500;
}
function endWindow(now){
  const c=G.cue;
  if(c.required){G.stats.slow++;G.graceUntil=now+600;fail(now,"Too slow. It's still "+stateWord(playing)+".",c.duringFreeze)}
  else success(now,0);
}

function tick(now){
  const dt=Math.min(.05,(now-(tick.last||now))/1000);tick.last=now;
  updateFx(dt,now);
  if(playing){if(fx.frozen<=0)vt+=dt;else if(Math.random()<.035)vt+=.07}
  else if(fx.drift>0)vt+=dt*.22;
  if(vt>DURATION-5)vt=30;
  if(G.phase==="gap"&&now>=G.nextAt)newCue(now);
  if(G.phase==="cue"){
    const el=(now-G.cue.start)/1000;
    $("cueFill").style.width=Math.max(0,100*(1-el/G.cue.win))+"%";
    if(el>=G.cue.win)endWindow(now);
  }
  draw(now);
  $("controls").classList.toggle("hidden",!!(G.lv.hideControls&&G.phase!=="idle"));
  $("ctlIcon").setAttribute("d",playing?PAUSE:PLAY);
  $("progFill").style.width=(100*vt/DURATION)+"%";
  $("timeLabel").textContent=fmt(vt)+" / "+fmt(DURATION);
  requestAnimationFrame(tick);
}

// ---------- flow ----------
function startLevel(i){
  G={phase:"count",lvIdx:i,lv:LEVELS[i],hearts:3,progress:0,score:0,cue:null,nextAt:0,graceUntil:0,lastCueEnd:0,stats:newStats(),matchStreak:0};
  playing=true;fx.frozen=0;fx.drift=0;closeOverlay();hud();$("toast").textContent="";
  let n=3;setCue(String(n),true);
  const iv=setInterval(()=>{n--;if(n>0){setCue(String(n),true)}else{clearInterval(iv);setCue("",true);G.phase="gap";G.nextAt=performance.now()+600}},650);
}
function insight(s,win){
  const avg=s.rts.length?Math.round(s.rts.reduce((a,b)=>a+b,0)/s.rts.length):null;
  if(s.freezeErr>=2)return`${s.freezeErr} of your mistakes came while the picture had stopped or drifted on its own. When the screen and your memory disagreed, you believed the screen.`;
  if(s.dodgeCues>=3&&s.flinch/s.dodgeCues>=.3)return`You moved on ${s.flinch} of ${s.dodgeCues} cues that asked for nothing. Your hand reacted to the word before your eyes checked the state.`;
  if(s.unprompted>=2)return`You pressed ${s.unprompted} times when no cue was showing. Once a rhythm sets in, the hand starts acting on its own.`;
  if(s.slow>=2)return`You ran out of time ${s.slow} times. Hesitating is the other way to fail: stopping to check costs time.`;
  if(s.dodgeCues>=3&&s.flinch===0)return`You never flinched on a cue that was already true. You were checking the state, not just reacting to the word.`;
  if(avg)return`Average reaction ${avg} ms. ${win?"Clean.":"So close."}`;
  return win?"Clean.":"Try again.";
}
function finish(win){
  const s=G.stats,L=G.lv;clearCue(performance.now());
  if(win&&G.lvIdx+1>unlocked){unlocked=Math.min(LEVELS.length-1,G.lvIdx+1);save("unlocked",unlocked)}
  if(L.endless&&G.score>best){best=G.score;save("best",best)}
  const avg=s.rts.length?Math.round(s.rts.reduce((a,b)=>a+b,0)/s.rts.length)+"":"—";
  const holds=s.dodgeCues?s.dodgeHeld+"/"+s.dodgeCues:"—";
  const next=G.lvIdx+1<LEVELS.length&&win;
  const head=L.endless?`<div class="eyebrow">Endless</div><h2>Score ${G.score}</h2><p>Best: ${best}</p>`
    :`<div class="eyebrow">Level ${G.lvIdx+1} · ${L.name}</div><h2>${win?"Cleared":"Out of hearts"}</h2>`;
  showOverlay(`${head}
    <div class="stats">
      <div class="stat"><b>${avg}</b><small>avg reaction, ms</small></div>
      <div class="stat"><b>${holds}</b><small>held still when asked for nothing</small></div>
      <div class="stat"><b>${s.flinch+s.unprompted}</b><small>presses nobody asked for</small></div>
    </div>
    <p class="insight">${insight(s,win)}</p>
    <div>
      ${next?`<button class="btn" data-go="${G.lvIdx+1}">Next: ${LEVELS[G.lvIdx+1].name}</button>`:""}
      <button class="btn ${next?"ghost":""}" data-intro="${G.lvIdx}">${win&&!L.endless?"Replay":"Retry"}</button>
      <button class="btn ghost" data-menu>Levels</button>
    </div>`);
  G.phase="idle";hud();setCue("",true);
}
function intro(i){
  const L=LEVELS[i];
  showOverlay(`<div class="eyebrow">Level ${i+1}</div><h2>${L.name}</h2><p>${L.rule}</p>
    <p style="color:var(--mute);font-size:13px">${L.endless?"":L.n+" cues · "}3 hearts · one button</p>
    <div><button class="btn" data-go="${i}">Start</button><button class="btn ghost" data-menu>Levels</button></div>`);
}
function menu(){
  G.phase="idle";G.lv=LEVELS[0];hud();setCue("",true);playing=true;
  showOverlay(`<h1>Un<span>Paws</span></h1>
    <p>A video. A word. One button.</p>
    <p style="color:var(--mute)">Toggle with <span class="kbd">Space</span>, <span class="kbd">K</span> or a tap on the video. Make the video match the cue, and only press when pressing is the answer.</p>
    <div class="levels">${LEVELS.map((L,i)=>`<button class="lv" data-intro="${i}" ${i>unlocked?"disabled":""}><b>${i+1}. ${L.name}</b><small>${i>unlocked?"locked":(L.endless?"best "+best:"open")}</small></button>`).join("")}</div>
    <div><button class="btn" data-intro="${Math.min(unlocked,LEVELS.length-1)}">${unlocked?"Continue":"Play"}</button></div>`);
}
function showOverlay(html){card.innerHTML=html;overlay.classList.remove("hide");const b=card.querySelector(".btn");if(b)b.focus()}
function closeOverlay(){overlay.classList.add("hide");if(document.activeElement)document.activeElement.blur()}
card.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b||b.disabled)return;
  if(b.dataset.go!=null)startLevel(+b.dataset.go);
  else if(b.dataset.intro!=null)intro(+b.dataset.intro);
  else if(b.hasAttribute("data-menu"))menu();
});
$("home").addEventListener("click",menu);

// ---------- input ----------
document.addEventListener("keydown",e=>{
  const overlayOpen=!overlay.classList.contains("hide");
  if(overlayOpen){if(e.key==="Enter"||e.code==="Space"){const b=document.activeElement&&document.activeElement.closest?document.activeElement.closest("button"):null;if(!b){const f=card.querySelector(".btn");if(f){e.preventDefault();f.click()}}}return}
  if(e.code==="Space"||e.key==="k"||e.key==="K"){e.preventDefault();if(!e.repeat)press()}
});
player.addEventListener("pointerdown",e=>{e.preventDefault();press()});

menu();
requestAnimationFrame(tick);
})();
</script>
</body>
</html>
